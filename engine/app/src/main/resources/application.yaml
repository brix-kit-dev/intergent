# Blueprint 12.6: bind to localhost only and stay off the ports Brix holds.
server:
  address: 127.0.0.1
  port: 18080
# A log line carries the ID of its request and the caller's trace, so both lead to the logs.
logging:
  pattern:
    correlation: "[%X{request_id:-}] [%X{trace_id:-}] "
spring:
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
