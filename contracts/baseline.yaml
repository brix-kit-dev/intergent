openapi: 3.1.0
info:
  title: AI Engine API
  version: "2026-11-05"
  description: |
    The public contract of the engine and the single source of the public API.
    `info.version` is the date version sent in `Engine-Version`.

    Compatibility: new fields, optional parameters, event types and enum values are not
    breaking changes, so clients must ignore what they do not recognise.
servers:
  - url: http://127.0.0.1:18080
    description: Dev server. Each cell has its own address.
tags:
  - name: identity
    description: Keys and short-lived tokens.
  - name: conversations
    description: Conversations and messages.
  - name: streams
    description: Reading a streamed answer again.
security:
  - apiKey: []

paths:
  /v1/sessions:
    parameters:
      - $ref: "#/components/parameters/EngineVersion"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/OnBehalfOf"
    post:
      operationId: createSession
      summary: Exchange a server key for a short-lived end user token.
      tags: [identity]
      x-callers: [server]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: The token. Send it to the browser.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/anonymous-sessions:
    parameters:
      - $ref: "#/components/parameters/EngineVersion"
      - $ref: "#/components/parameters/Traceparent"
    post:
      operationId: createAnonymousSession
      summary: Exchange a public site key for a token with the lowest rights.
      description: The engine also checks the request origin against the site key.
      tags: [identity]
      x-callers: [browser]
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnonymousSessionRequest"
      responses:
        "201":
          description: The token.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/api-keys:
    parameters:
      - $ref: "#/components/parameters/EngineVersion"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/OnBehalfOf"
    post:
      operationId: createApiKey
      summary: Create a key. Old and new keys work side by side during a rotation.
      tags: [identity]
      x-callers: [server]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: The key. This is the only time it is shown.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/api-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/EngineVersion"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/OnBehalfOf"
      - $ref: "#/components/parameters/KeyId"
    delete:
      operationId: deleteApiKey
      summary: Revoke a key.
      tags: [identity]
      x-callers: [server]
      responses:
        "204":
          description: The key no longer works.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/conversations:
    parameters:
      - $ref: "#/components/parameters/EngineVersion"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/OnBehalfOf"
    post:
      operationId: createConversation
      summary: Start a conversation.
      tags: [conversations]
      x-callers: [server, browser]
      security:
        - apiKey: []
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: The conversation.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/EngineVersion"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/OnBehalfOf"
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      summary: Read a conversation.
      tags: [conversations]
      x-callers: [server, browser]
      security:
        - apiKey: []
        - sessionToken: []
      responses:
        "200":
          description: The conversation.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/EngineVersion"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/OnBehalfOf"
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: createMessage
      summary: Send a message and get the answer.
      description: |
        With `Accept: text/event-stream` the answer streams, see `x-stream-events`.
        Otherwise the call returns the finished answer.

        A retry with the same `Idempotency-Key` does not generate again. It joins the stream
        while the answer is being generated, and replays the same events once it has ended.

        Input checks, budget and model eligibility fail before the first event, as plain HTTP
        errors. A failure after the first event is an `error` event. A lost connection does not
        stop the answer. While no event is due, the stream sends SSE comments to stay open.
      tags: [conversations]
      x-callers: [server, browser]
      security:
        - apiKey: []
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "200":
          description: The finished answer, or the stream of it.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/BudgetExceeded"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listMessages
      summary: Read the message history, oldest first.
      tags: [conversations]
      x-callers: [server, browser]
      security:
        - apiKey: []
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of messages.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/conversations/{conversation_id}/messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/EngineVersion"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/OnBehalfOf"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    get:
      operationId: getMessage
      summary: Read one message.
      tags: [conversations]
      x-callers: [server, browser]
      security:
        - apiKey: []
        - sessionToken: []
      responses:
        "200":
          description: The message.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/conversations/{conversation_id}/messages/{message_id}/events:
    parameters:
      - $ref: "#/components/parameters/EngineVersion"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/OnBehalfOf"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    get:
      operationId: streamMessageEvents
      summary: Resume a stream after a lost connection.
      description: Sends every event after `Last-Event-ID`, with none repeated or missed.
      tags: [streams]
      x-callers: [server, browser]
      security:
        - apiKey: []
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: The rest of the stream.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/conversations/{conversation_id}/messages/{message_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/EngineVersion"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/OnBehalfOf"
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/MessageId"
    post:
      operationId: cancelMessage
      summary: Stop generating an answer.
      description: Safe to repeat. After the answer has ended it changes nothing.
      tags: [conversations]
      x-callers: [server, browser]
      security:
        - apiKey: []
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The message, with what was generated so far.
          headers:
            Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"

# Every SSE event by name. The SSE `event` field holds the name and `data` holds the JSON payload.
# Each event has an increasing SSE `id`, and every message ends with exactly one ending event.
x-stream-events:
  message.started:
    $ref: "#/components/schemas/MessageStartedEvent"
  message.delta:
    $ref: "#/components/schemas/MessageDeltaEvent"
  message.citation:
    $ref: "#/components/schemas/MessageCitationEvent"
  tool.started:
    $ref: "#/components/schemas/ToolStartedEvent"
  tool.finished:
    $ref: "#/components/schemas/ToolFinishedEvent"
  handoff.requested:
    $ref: "#/components/schemas/HandoffRequestedEvent"
  message.completed:
    $ref: "#/components/schemas/MessageCompletedEvent"
  message.blocked:
    $ref: "#/components/schemas/MessageBlockedEvent"
  message.cancelled:
    $ref: "#/components/schemas/MessageCancelledEvent"
  error:
    $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A server key. Never send it to a browser.
    sessionToken:
      type: http
      scheme: bearer
      description: A short-lived token, the only credential a browser holds.

  parameters:
    EngineVersion:
      name: Engine-Version
      in: header
      description: The date version. Without it the version locked on the application applies.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      example: "2026-11-05"
    Traceparent:
      name: traceparent
      in: header
      description: W3C Trace Context. The engine passes it on.
      schema:
        type: string
        maxLength: 55
    OnBehalfOf:
      name: On-Behalf-Of
      in: header
      description: The lower tenant a platform host acts for. Server keys only.
      schema:
        type: string
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Kept for 24 hours, separately for each tenant and application. The same key with a
        different body returns `idempotency_key_reused`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/KeyId"
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ConversationId"
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MessageId"
    Limit:
      name: limit
      in: query
      description: The page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 255
    LastEventId:
      name: Last-Event-ID
      in: header
      description: The SSE `id` of the last event received. Without it the stream starts from the first event.
      schema:
        type: string
        maxLength: 64

  headers:
    RequestId:
      description: Identifies this request. Quote it when reporting a problem.
      required: true
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      required: true
      schema:
        type: integer
        minimum: 0

  responses:
    BadRequest:
      description: "`invalid_request`"
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "`unauthorized`"
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BudgetExceeded:
      description: "`budget_exceeded`"
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "`forbidden`"
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "`not_found`"
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "`idempotency_key_in_use`"
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: "`stream_expired`"
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: "`idempotency_key_reused`, `input_blocked`, `no_eligible_model`"
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: "`rate_limited`"
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: "`model_unavailable`"
      headers:
        Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    KeyId:
      type: string
      pattern: "^key_[0-9A-Za-z]+$"
      maxLength: 64
    EndUserId:
      type: string
      pattern: "^eu_[0-9A-Za-z]+$"
      maxLength: 64
    ConversationId:
      type: string
      pattern: "^conv_[0-9A-Za-z]+$"
      maxLength: 64
    MessageId:
      type: string
      pattern: "^msg_[0-9A-Za-z]+$"
      maxLength: 64
    Locale:
      type: string
      description: A BCP 47 language tag, such as `ja-JP`.
      maxLength: 35
      example: ja-JP
    ExternalUserId:
      type: string
      description: The host's own identifier for the end user. The engine keeps no accounts.
      minLength: 1
      maxLength: 255
    IdentityLevel:
      type: string
      description: How far the host vouches for this end user.
      x-extensible-enum: [anonymous, unverified, verified]
    ErrorCode:
      type: string
      description: A stable code. Its meaning never changes after release.
      x-extensible-enum:
        - invalid_request
        - unauthorized
        - budget_exceeded
        - forbidden
        - not_found
        - idempotency_key_in_use
        - stream_expired
        - idempotency_key_reused
        - input_blocked
        - no_eligible_model
        - action_schema_invalid
        - rate_limited
        - model_unavailable
        - output_blocked
        - model_failed
        - stream_interrupted

    Problem:
      type: object
      description: RFC 9457 problem details, with a stable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: "#/components/schemas/ErrorCode"

    CreateSessionRequest:
      type: object
      required: [external_user_id]
      properties:
        external_user_id:
          $ref: "#/components/schemas/ExternalUserId"
        identity_level:
          type: string
          description: Defaults to `verified`. `anonymous` belongs to site keys.
          enum: [unverified, verified]
        scopes:
          type: array
          description: What this token may do. Host actions compare these names.
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[A-Za-z0-9_.:-]+$"
        context:
          type: object
          description: |
            Business identifiers the host binds to this session, such as an order number. The
            model cannot change them. They travel with the token to the browser, so no secrets.
          maxProperties: 10
          propertyNames:
            minLength: 1
            maxLength: 40
            pattern: "^[A-Za-z0-9_.:-]+$"
          additionalProperties:
            type: string
            maxLength: 200
        locale:
          $ref: "#/components/schemas/Locale"

    CreateAnonymousSessionRequest:
      type: object
      required: [site_key]
      properties:
        site_key:
          type: string
          description: The public site key.
          maxLength: 255
        locale:
          $ref: "#/components/schemas/Locale"

    Session:
      type: object
      required: [expires_at, end_user_id, identity_level]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        end_user_id:
          $ref: "#/components/schemas/EndUserId"
        identity_level:
          $ref: "#/components/schemas/IdentityLevel"
        scopes:
          type: array
          items:
            type: string

    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        expires_at:
          type: string
          format: date-time

    CreatedApiKey:
      type: object
      required: [id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/KeyId"
        key:
          type: string
          description: The secret. Treat it as opaque. It is shown once and stored only as a hash.
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      properties:
        external_user_id:
          allOf:
            - $ref: "#/components/schemas/ExternalUserId"
          description: Required with a server key. A browser token already names its user.
        locale:
          $ref: "#/components/schemas/Locale"

    Conversation:
      type: object
      required: [id, end_user_id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/ConversationId"
        end_user_id:
          $ref: "#/components/schemas/EndUserId"
        locale:
          $ref: "#/components/schemas/Locale"
        created_at:
          type: string
          format: date-time

    CreateMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 32000
        locale:
          $ref: "#/components/schemas/Locale"
        data_class:
          type: string
          description: The data class the caller declares. The engine can only raise it.
          enum: [public, internal, personal, sensitive]

    Message:
      type: object
      required: [id, conversation_id, role, status, text, created_at]
      properties:
        id:
          $ref: "#/components/schemas/MessageId"
        conversation_id:
          $ref: "#/components/schemas/ConversationId"
        role:
          type: string
          x-extensible-enum: [user, assistant]
        status:
          type: string
          x-extensible-enum: [in_progress, completed, blocked, cancelled, failed]
        text:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        usage:
          $ref: "#/components/schemas/Usage"
        code:
          allOf:
            - $ref: "#/components/schemas/ErrorCode"
          description: Why the answer ended early. Only with `blocked` and `failed`.
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    MessageList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: [string, "null"]
          description: Pass it as `cursor` for the next page. `null` on the last page.

    Citation:
      type: object
      required: [external_id]
      properties:
        external_id:
          type: string
          description: The host's identifier for the source document.
        title:
          type: string
        url:
          type: string
          format: uri
        quote:
          type: string

    Usage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64

    MessageStartedEvent:
      type: object
      description: Keep `message_id` to resume the stream.
      required: [message_id]
      properties:
        message_id:
          $ref: "#/components/schemas/MessageId"

    MessageDeltaEvent:
      type: object
      required: [message_id, text]
      properties:
        message_id:
          $ref: "#/components/schemas/MessageId"
        text:
          type: string

    MessageCitationEvent:
      type: object
      required: [message_id, citation]
      properties:
        message_id:
          $ref: "#/components/schemas/MessageId"
        citation:
          $ref: "#/components/schemas/Citation"

    ToolStartedEvent:
      type: object
      required: [message_id, name]
      properties:
        message_id:
          $ref: "#/components/schemas/MessageId"
        name:
          type: string

    ToolFinishedEvent:
      type: object
      required: [message_id, name]
      properties:
        message_id:
          $ref: "#/components/schemas/MessageId"
        name:
          type: string

    HandoffRequestedEvent:
      type: object
      required: [message_id]
      properties:
        message_id:
          $ref: "#/components/schemas/MessageId"

    MessageCompletedEvent:
      type: object
      description: An ending event.
      required: [message_id, usage]
      properties:
        message_id:
          $ref: "#/components/schemas/MessageId"
        usage:
          $ref: "#/components/schemas/Usage"

    MessageBlockedEvent:
      type: object
      description: An ending event. Everything sent before it is void, so the client must take it back.
      required: [message_id, code]
      properties:
        message_id:
          $ref: "#/components/schemas/MessageId"
        code:
          $ref: "#/components/schemas/ErrorCode"

    MessageCancelledEvent:
      type: object
      description: An ending event. `text` is what was generated before the cancel.
      required: [message_id, text, usage]
      properties:
        message_id:
          $ref: "#/components/schemas/MessageId"
        text:
          type: string
        usage:
          $ref: "#/components/schemas/Usage"
