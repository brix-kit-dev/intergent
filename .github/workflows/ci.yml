# The whole check lives in engine/verify.sh, so it runs the same here and on the dev server.
# Every tool is pinned to exact content (S-8). Change a pin only to a release at least 7 days old.
name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engine
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: eclipse-temurin:21.0.12.1_1-jdk-noble@sha256:57424b1d8eca9c4cf8a4fe226207027911f08d6758628891bf59fcfb53777029 # JDK 21.0.12.1, released 2026-10-26
    env:
      MAVEN_VERSION: 3.8.7
      MAVEN_SHA256: 628b49352130d1d25d5519b1c724f0efe58b86bad55f37a694ca8f73f11e3604 # Maven 3.8.7, released 2022-12-24
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, released 2026-07-17
        with:
          persist-credentials: false

      - name: Install Maven
        run: |
          curl -fsSL -o /tmp/maven.tar.gz "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          echo "${MAVEN_SHA256}  /tmp/maven.tar.gz" | sha256sum -c -
          tar -xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify
        run: engine/verify.sh
